<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미니 리액트 오목</title>
  <link rel="stylesheet" href="omok/style.css">
</head>
<body>
  <button type="button" id="panel-toggle" class="panel-toggle" aria-expanded="false" aria-controls="engine-panel">
    <span class="bars" aria-hidden="true"></span>엔진
  </button>

  <aside id="engine-panel" class="engine-panel" aria-label="엔진 내부 상태">
    <div class="panel-head">
      <h2>엔진 내부 상태</h2>
      <button type="button" class="panel-close" aria-label="패널 닫기">×</button>
    </div>
    <label class="field">엔진 버전
      <select id="engine-select"></select>
    </label>
    <dl class="kv">
      <dt>지금 엔진</dt><dd data-cell="engine">-</dd>
      <dt>배칭</dt><dd data-cell="batch">-</dd>
      <dt>커밋 누계</dt><dd data-cell="commits">0</dd>
      <dt>DOM 변경 누계</dt><dd data-cell="dom">0</dd>
    </dl>
    <h3>마지막 커밋</h3>
    <dl class="kv">
      <dt>원인</dt><dd data-cell="cause">-</dd>
      <dt>종류</dt><dd data-cell="kind">-</dd>
      <dt>시간(ms)</dt><dd data-cell="ms">-</dd>
      <dt>비교한 노드</dt><dd data-cell="compared">-</dd>
      <dt>patch</dt><dd data-cell="patches">-</dd>
      <dt>이벤트만 바뀐 PROPS</dt><dd data-cell="event-only">-</dd>
    </dl>
    <h3>커밋 기록 <small>최근 순</small></h3>
    <ol class="log"></ol>
    <h3>Hooks <small>App 의 hooks 배열</small></h3>
    <ol class="hooks" start="0"></ol>
  </aside>

  <header class="top">
    <h1>오목</h1>
    <p>미니 리액트 엔진으로 그린 2인용 대국</p>
  </header>

  <main id="app"></main>

  <script src="omok/loader.js"></script>
</body>
</html>
